name: Despliegue Continuo a Azure Blob Storage

on:
  push:
    branches:
      - main
      - principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Sincronizar con Azure Blob Storage
        env:
          AZURE_CONN_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload-batch \
            --account-name sitioestaticopacman26ca \
            --connection-string "$AZURE_CONN_STRING" \
            --destination '$web' \
            --source . \
            --overwrite true